name: CI/CD

on:
  push:
    branches: [main]   # push main  → chỉ build + test
    tags: ['v*']                # push tag   → build + test + docker push
  pull_request:
    branches: [main, develop]   # kiểm tra PR trước khi merge

jobs:
  # ================= BUILD + TEST =================
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build
        run: |
          npm ci
          npm run build
      - name: Test (lint)
        run: npm run lint
        continue-on-error: true   # code hiện có 53 lỗi lint; sửa xong thì xóa dòng này

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Build
        run: bash mvnw -B compile
      - name: Test
        run: bash mvnw -B test

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Build
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Test (kiểm tra cú pháp)
        run: python -m compileall -q app

  # ========== DOCKER BUILD & PUSH (chỉ khi push tag v*) ==========
  docker:
    needs: [frontend, backend, ai-service]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [frontend, backend, ai-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/sca-${{ matrix.service }}:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/sca-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}